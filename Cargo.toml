[workspace]
members = [
    "crates/josh-cli",
    "crates/josh-exec",
    "crates/josh-interactive",
    "crates/josh-lsp",
    "crates/josh-runtime",
    "crates/josh-streams",
    "crates/josh-syntax",
]
default-members = ["crates/josh-cli"]
resolver = "3"

# josh-lsp stays a separate binary on purpose: the tower-lsp/tokio/ICU
# dependency stack adds ~1.6MB of cold code, and linking it into the josh
# binary erases the PGO layout win (~285ms -> ~395ms bench_total, measured
# 2026-08-17). `josh lsp` execs the sibling josh-lsp binary instead.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
josh-exec = { path = "crates/josh-exec" }
josh-interactive = { path = "crates/josh-interactive" }
josh-lsp = { path = "crates/josh-lsp" }
josh-runtime = { path = "crates/josh-runtime" }
josh-streams = { path = "crates/josh-streams" }
josh-syntax = { path = "crates/josh-syntax" }
compact_str = "0.9.1"
glob = "0.3.2"
jiff = "0.2.13"
nix = { version = "0.30.1", features = ["poll", "process", "signal", "term"] }
nu-ansi-term = "0.50.3"
os_pipe = "1.2.3"
reedline = "0.49.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
signal-hook = "0.3.18"
tempfile = "3.20.0"
thiserror = "2.0.12"
unicode-ident = "1.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
