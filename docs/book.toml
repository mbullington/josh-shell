[book]
title = "Josh Manual"
description = "The manual for Josh and agent-terminal"
authors = ["Josh contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = false

[output.html.print]
enable = true
