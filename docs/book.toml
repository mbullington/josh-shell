[book]
title = "Josh Manual"
description = "The status-safe manual for Josh and agent-terminal"
authors = ["Josh contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/status.css"]
no-section-label = false

[output.html.print]
enable = true
